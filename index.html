<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cartoon Supercell — Procedural Grass Terrain</title>
<style>
  :root{
    --ui-green:#7ec850; --ui-dark:#1c2b12;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0e1408;
    font-family:"Segoe UI", system-ui, sans-serif; touch-action:none; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }

  /* ---------- HUD ---------- */
  #hud{ position:fixed; top:14px; left:14px; z-index:20; color:#eaffd8;
    text-shadow:0 2px 6px rgba(0,0,0,.6); pointer-events:none; user-select:none; }
  #hud h1{ font-size:18px; letter-spacing:.5px; }
  #hud h1 span{ color:var(--ui-green); }
  #hud p{ font-size:12px; opacity:.75; margin-top:3px; }
  #stats{ font-size:11px; opacity:.65; margin-top:6px; font-family:monospace; }

  /* ---------- Color-correction panel ---------- */
  #grade{ position:fixed; top:14px; right:14px; z-index:20; width:210px;
    background:rgba(12,20,6,.72); border:1px solid rgba(126,200,80,.35);
    border-radius:12px; padding:12px 14px; color:#dff5c8; backdrop-filter:blur(6px); }
  #grade h2{ font-size:12px; text-transform:uppercase; letter-spacing:1px;
    color:var(--ui-green); margin-bottom:8px; }
  #grade label{ display:flex; justify-content:space-between; font-size:11px; margin-top:7px; }
  #grade input[type=range]{ width:100%; accent-color:var(--ui-green); height:18px; }
  #grade .row{ display:flex; gap:6px; margin-top:8px; }
  #grade button{ flex:1; background:rgba(126,200,80,.15); color:#dff5c8;
    border:1px solid rgba(126,200,80,.4); border-radius:8px; padding:5px 0;
    font-size:11px; cursor:pointer; }
  #grade button:hover{ background:rgba(126,200,80,.3); }
  @media (max-width:640px){ #grade{ display:none; } #hud h1{ font-size:14px; } }

  /* ---------- Joystick (mobile) ---------- */
  #joystick{ position:fixed; left:26px; bottom:26px; width:130px; height:130px;
    border-radius:50%; z-index:30; display:none;
    background:radial-gradient(circle at 50% 40%, rgba(126,200,80,.18), rgba(20,32,10,.55));
    border:2px solid rgba(126,200,80,.45); box-shadow:0 4px 18px rgba(0,0,0,.4); }
  #stick{ position:absolute; left:50%; top:50%; width:56px; height:56px;
    border-radius:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%, #a8e878, #4d8a2a 70%);
    border:2px solid rgba(255,255,255,.35); }
  #lookzone{ position:fixed; right:0; top:0; width:55%; height:100%; z-index:25; display:none; }
  body.mobile #joystick, body.mobile #lookzone{ display:block; }
  body.mobile #hint{ display:block; }

  #hint{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    z-index:20; display:none; color:#eaffd8; font-size:12px; opacity:.8;
    text-shadow:0 2px 4px rgba(0,0,0,.6); pointer-events:none; }

  #flash{ position:fixed; inset:0; z-index:15; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 30%, rgba(190,255,170,.9), rgba(60,140,60,.25) 60%, transparent);
    mix-blend-mode:screen; }
  #loading{ position:fixed; inset:0; z-index:50; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:14px; background:#0e1408;
    color:#dff5c8; transition:opacity .6s; }
  #loading .bar{ width:220px; height:6px; border-radius:3px; background:#243616; overflow:hidden; }
  #loading .bar i{ display:block; height:100%; width:0%; background:var(--ui-green); transition:width .3s; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="flash"></div>

  <div id="hud">
    <h1>🌪 Cartoon <span>Supercell</span> Terrain</h1>
    <p>Procedural bumps &amp; bends · 150 × 120 km · GPU smoke storm · <b style="color:#a8e878">build v2</b></p>
    <div id="stats"></div>
  </div>

  <div id="grade">
    <h2>Color Grade</h2>
    <label>Exposure <span id="v-exposure">1.05</span></label>
    <input type="range" id="s-exposure" min="0.4" max="2.0" step="0.01" value="1.05">
    <label>Saturation <span id="v-saturation">1.25</span></label>
    <input type="range" id="s-saturation" min="0" max="2" step="0.01" value="1.25">
    <label>Contrast <span id="v-contrast">1.08</span></label>
    <input type="range" id="s-contrast" min="0.5" max="2" step="0.01" value="1.08">
    <label>Green Lift <span id="v-green">0.10</span></label>
    <input type="range" id="s-green" min="0" max="0.4" step="0.005" value="0.10">
    <label>Vignette <span id="v-vignette">0.35</span></label>
    <input type="range" id="s-vignette" min="0" max="1" step="0.01" value="0.35">
    <div class="row">
      <button id="preset-cartoon">Cartoon</button>
      <button id="preset-storm">Storm</button>
      <button id="preset-noir">Noir</button>
    </div>
  </div>

  <div id="joystick"><div id="stick"></div></div>
  <div id="lookzone"></div>
  <div id="hint">Left stick: move · Right side: look</div>

  <div id="loading">
    <div style="font-size:20px">🌱 Growing 150 km of cartoon grass…</div>
    <div class="bar"><i id="loadbar"></i></div>
  </div>

  <script>
    window.__errs = [];
    window.addEventListener('error', e => {
      window.__errs.push((e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      const el = document.querySelector('#loading div');
      if (el) el.textContent = '⚠ ' + window.__errs.join(' | ');
    });
    window.addEventListener('unhandledrejection', e => {
      window.__errs.push('promise: ' + (e.reason && e.reason.message || e.reason));
      const el = document.querySelector('#loading div');
      if (el) el.textContent = '⚠ ' + window.__errs.join(' | ');
    });
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js?v=2"></script>
</body>
</html>
